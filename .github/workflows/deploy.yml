name: Deploy to AWS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC で AWS ロールを引き受けるのに必要

concurrency:
  group: "deploy"
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Cache-Control は 3 段階に分ける。CloudFront はオリジンのこのヘッダを尊重する。
      # 1) ハッシュ付きビルド成果物 → 1年 immutable
      - name: Upload hashed build assets
        run: |
          aws s3 sync out/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public,max-age=31536000,immutable"

      # 2) 画像・PDF など内容が変わりにくい静的メディア → 1週間
      - name: Upload static media
        run: |
          aws s3 sync out/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "*" --include "assets/*" --include "img/*" \
            --cache-control "public,max-age=604800"

      # 3) HTML と RSC ペイロード(.txt) → 常に再検証。ここが古いと全体が壊れる
      - name: Upload HTML and RSC payloads
        run: |
          aws s3 sync out/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "_next/static/*" --exclude "assets/*" --exclude "img/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
